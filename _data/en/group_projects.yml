- primary: Happily Ever Improv
  secondary: Since 2023
  content: |
    Happily Ever Improv is a queer feminist performance group based in Berlin, co-founded in 2024. Five performers creating live, audience-shaped work that treats joy and care as dramaturgical tools.
    The work challenges dominant performance conventions: no humiliation, low conflict, no stereotypes. The group builds from embodied presence, musicality, and centering queer and non-binary characters.
    Each performance is an act of live research: testing how stories hold together without cruelty, how status can exist without dominance, how shared physical space can become, for one hour, a place where everyone belongs.

- primary: Somewhere Maybe Here
  secondary: 06/2017 - 01/2019
  content: |
    “Somewhere Maybe Here” is an ongoing project created by a team of artists from different practises. A fallen angel wanders in the streets of Berlin, craving interaction with humans. This piece focuses on humans in an urban environment and their reaction to this character who disrupts their everyday life. The final outcome will be a silent film screening with live piano playing. Afterwards, followedby an analog photography exhibition.
